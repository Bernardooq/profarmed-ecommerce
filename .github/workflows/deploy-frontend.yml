name: Deploy Frontend to S3 & CloudFront

on:
  push:
    branches:
      - main
    paths:
      - 'react/**'
  workflow_dispatch:

jobs:
  deploy:
    name: Build & Publish Frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'
          cache-dependency-path: react/package-lock.json

      - name: Setup Environment & Build
        working-directory: react
        env:
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL || vars.VITE_API_BASE_URL }}
          VITE_TURNSTILE_SITE_KEY: ${{ secrets.VITE_TURNSTILE_SITE_KEY || vars.VITE_TURNSTILE_SITE_KEY }}
          VITE_BRAND_NAME: ${{ secrets.VITE_BRAND_NAME || vars.VITE_BRAND_NAME }}
          VITE_THEME_COLOR: ${{ secrets.VITE_THEME_COLOR || vars.VITE_THEME_COLOR }}
        run: |
          # 1. Crear .env desde .env.example si .env no existe en el runner de GitHub
          if [ -f .env.example ] && [ ! -f .env ]; then
            echo "Inicializando react/.env a partir de .env.example..."
            cp .env.example .env
          fi
          
          # 2. Inyectar variables o secretos configurados en GitHub Actions (si existen)
          if [ -n "$VITE_API_BASE_URL" ]; then
            echo "VITE_API_BASE_URL=$VITE_API_BASE_URL" >> .env
          fi
          if [ -n "$VITE_TURNSTILE_SITE_KEY" ]; then
            echo "VITE_TURNSTILE_SITE_KEY=$VITE_TURNSTILE_SITE_KEY" >> .env
          fi
          if [ -n "$VITE_BRAND_NAME" ]; then
            echo "VITE_BRAND_NAME=$VITE_BRAND_NAME" >> .env
          fi
          if [ -n "$VITE_THEME_COLOR" ]; then
            echo "VITE_THEME_COLOR=$VITE_THEME_COLOR" >> .env
          fi

          echo "Instalando dependencias y compilando Vite..."
          npm ci --legacy-peer-deps
          npm run build # Genera la carpeta 'dist/' de Vite

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION || vars.AWS_REGION || 'us-east-1' }}

      - name: Sync React build (dist/) to S3 Bucket
        env:
          FRONTEND_BUCKET: ${{ secrets.FRONTEND_BUCKET_NAME || vars.FRONTEND_BUCKET_NAME || 'profarmed-frontend' }}
        run: |
          # 1. Subir assets versionados con hash (CSS, JS, imagenes) con cache inmutable de 1 ano
          aws s3 sync react/dist/assets "s3://${FRONTEND_BUCKET}/assets" --cache-control "public, max-age=31536000, immutable"
          
          # 2. Sincronizar el resto de archivos (html, manifest, icons) con no-cache para que la PWA siempre pida el index nuevo
          aws s3 sync react/dist/ "s3://${FRONTEND_BUCKET}" --delete --exclude "assets/*" --cache-control "no-cache, no-store, must-revalidate"
          
          # 3. Asegurar explicitamente que index.html tenga no-cache y content-type text/html
          aws s3 cp react/dist/index.html "s3://${FRONTEND_BUCKET}/index.html" --cache-control "no-cache, no-store, must-revalidate" --content-type "text/html"

      - name: Invalidate CloudFront Cache
        env:
          DISTRIBUTION_ID: ${{ secrets.FRONTEND_CLOUDFRONT_DISTRIBUTION_ID || secrets.CLOUDFRONT_DISTRIBUTION_ID || vars.FRONTEND_CLOUDFRONT_DISTRIBUTION_ID }}
        run: |
          if [ -n "$DISTRIBUTION_ID" ]; then
            echo "Invalidando cache en CloudFront ($DISTRIBUTION_ID)..."
            aws cloudfront create-invalidation \
              --distribution-id "$DISTRIBUTION_ID" \
              --paths "/*"
            echo "Sincronizacion e invalidacion de CloudFront completadas exitosamente."
          else
            echo "Aviso: DISTRIBUTION_ID no definido. Se omitio la invalidacion de CloudFront."
          fi
