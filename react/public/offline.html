<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="%BRAND_THEME_COLOR%">
  <title>Sin Conexión | %BRAND_NAME%</title>
  <style>
    :root {
      --color-primary: %BRAND_THEME_COLOR%;
      --color-primary-hover: %BRAND_PRIMARY_HOVER%;
      --color-secondary: %BRAND_SECONDARY_COLOR%;
      --color-surface: %BRAND_SURFACE_COLOR%;
      --color-text: %BRAND_TEXT_COLOR%;
      --color-text-muted: %BRAND_TEXT_MUTED_COLOR%;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      background: linear-gradient(135deg, var(--color-secondary) 0%, var(--color-primary) 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
    }
    
    .container {
      background: var(--color-surface);
      border-radius: 20px;
      padding: 40px;
      max-width: 500px;
      text-align: center;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
    }
    
    .icon {
      font-size: 80px;
      margin-bottom: 20px;
    }
    
    h1 {
      color: var(--color-text);
      font-size: 28px;
      margin-bottom: 15px;
    }
    
    p {
      color: var(--color-text-muted);
      font-size: 16px;
      line-height: 1.6;
      margin-bottom: 30px;
    }
    
    .retry-btn {
      background: var(--color-primary);
      color: white;
      border: none;
      padding: 15px 40px;
      border-radius: 10px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
    }
    
    .retry-btn:hover {
      background: var(--color-primary-hover);
      transform: translateY(-2px);
      box-shadow: 0 5px 15px color-mix(in srgb, var(--color-primary) 30%, transparent);
    }
    
    .retry-btn:active {
      transform: translateY(0);
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="icon">📡</div>
    <h1>Sin Conexión a Internet</h1>
    <p>
      Esta aplicación requiere conexión a internet para funcionar correctamente.
      Por favor, verifica tu conexión e intenta nuevamente.
    </p>
    <button class="retry-btn" onclick="window.location.reload()">
      Reintentar
    </button>
  </div>
</body>
</html>
