version: '3.8'

services:
  db:
    build:
      context: ./database
    volumes:
      - postgres_data:/var/lib/postgresql/data/
      - ./database/schema/01_init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    environment:
      - POSTGRES_DB=profarmed_db
      - POSTGRES_USER=profarmed_user
      - POSTGRES_PASSWORD=supersecretpassword
    networks:
      - backend-net
    ports:
      - "5432:5432"
    expose:
      - "5432"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: >
      sh -c "python create_initial_admins.py && uvicorn profarmed_api.main:app --host 0.0.0.0 --port 8000 --reload"
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    env_file:
      - ./backend/profarmed_api/.env
    environment:
      - POSTGRES_NAME=profarmed_db
      - POSTGRES_USER=profarmed_user
      - POSTGRES_PASSWORD=supersecretpassword
      - POSTGRES_HOST=db
      - DATABASE_URL=postgresql://profarmed_user:supersecretpassword@db:5432/profarmed_db
      - FRONTEND_URL=*
    networks:
      - frontend-net
      - backend-net
    depends_on:
      - db

  frontend:
    build:
      context: ./react
    command: npm run dev -- --host 0.0.0.0
    volumes:
      - ./react/src:/app/src
      - ./react/public:/app/public
      - ./react/index.html:/app/index.html
      - ./react/vite.config.js:/app/vite.config.js
      - ./react/.env:/app/.env
    ports:
      - "3000:5173"   # Vite dev server corre en 5173, mapeamos a 3000
    networks:
      - frontend-net
    depends_on:
      - backend

volumes:
  postgres_data:

networks:
  frontend-net:
    driver: bridge
  backend-net:
    driver: bridge
